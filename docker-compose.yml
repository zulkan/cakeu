services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pg123
      POSTGRES_DB: catatku
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catatku"]
      interval: 5s
      timeout: 5s
      retries: 10

  be:
    build: ./be
    env_file: ./be/.env
    environment:
      DB_HOST: db
      PORT: "8080"
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  fe:
    build:
      context: ./fe
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:80"
    depends_on:
      - be

volumes:
  pgdata:
  appdata:
